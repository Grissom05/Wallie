[env:esp32-s3-devkitc-1]
platform = espressif32
; Use the base N8 pin profile with the N16R8 memory overrides below.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Match the N16R8 module's 16 MB flash and partition layout.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Configure QIO flash and OPI PSRAM modes for the 8 MB PSRAM.
board_build.arduino.memory_type = qio_opi

; Store the web interface in LittleFS.
board_build.filesystem = littlefs
lib_deps = bblanchon/ArduinoJson @ ^7.0.4

; Enable PSRAM support in the Arduino core.
build_flags =
    -DBOARD_HAS_PSRAM

