<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C5D4F">
<link rel="icon" type="image/png" href="favicon.png">
<title>Wallie – Registrazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E0EFEB; --surface:#FFFFFF; --ink:#12302A; --muted:#4A6B60;
  --line:#B4D0C6; --accent:#2C5D4F; --accent-ink:#FFFFFF; --soft:#CFE3DC; --err:#B3261E;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F211C; --surface:#17332B; --ink:#E7F4EA; --muted:#A3C4B8;
    --line:#2A4D43; --accent:#7CC4AE; --accent-ink:#0F211C; --soft:#1F4037; --err:#FF8A80;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:18px; line-height:1.4;
  display:flex; justify-content:center; align-items:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
}
main{width:100%; max-width:380px; text-align:center}
.logo{display:block; width:128px; height:128px; margin:0 auto 1rem}
.brand{font-size:2.4rem; font-weight:700; letter-spacing:-.02em; color:var(--accent); margin:0; line-height:1.1}
.tag{margin:.25rem 0 1.5rem; color:var(--muted); font-size:.95rem}
h1{font-size:1.6rem; margin:0 0 .25rem; letter-spacing:-.01em}
p.sub{margin:0; color:var(--muted)}
.steps{display:flex; justify-content:center; gap:8px; margin:1.25rem 0}
.steps i{width:36px; height:6px; border-radius:3px; background:var(--line)}
.steps i.on{background:var(--accent)}

input{
  width:100%; min-height:64px; margin-top:1.25rem; padding:0 18px; font:inherit; font-size:1.4rem;
  text-align:center; color:var(--ink); background:var(--surface);
  border:2px solid var(--line); border-radius:18px;
}
input:focus{border-color:var(--accent)}
.btn{
  width:100%; min-height:64px; margin-top:1rem; font:inherit; font-size:1.25rem; font-weight:700;
  color:var(--accent-ink); background:var(--accent); border:0; border-radius:18px; cursor:pointer;
}
.btn:disabled{opacity:.4; cursor:not-allowed}
.back{background:none; border:0; font:inherit; color:var(--accent); cursor:pointer; min-height:44px; margin-top:.5rem; font-weight:700}

.dots{display:flex; justify-content:center; gap:16px; margin:1.25rem 0 .5rem; min-height:28px}
.dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--accent)}
.dot.on{background:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
.msg{min-height:1.5em; margin:0 0 1rem; color:var(--muted)}
.msg.err{color:var(--err); font-weight:700}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.key{
  min-height:68px; font:inherit; font-size:1.7rem; font-weight:700; color:var(--ink);
  background:var(--surface); border:2px solid var(--line); border-radius:18px; cursor:pointer;
}
.key:hover{border-color:var(--accent)}
.key:active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.key.ghost{background:transparent; border-color:transparent; font-size:1.1rem; color:var(--muted)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.hidden{display:none !important}
.demo{margin-top:1.5rem; font-size:.85rem; color:var(--muted)}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="" width="128" height="128">
  <div class="brand">Wallie</div>
  <p class="tag">The help you need, right on time</p>

  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="steps" id="steps" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- Passo 1: nome -->
  <section id="s-name">
    <label for="name" class="sub">Il tuo nome</label>
    <input id="name" type="text" autocomplete="given-name" maxlength="24" placeholder="Es. Maria">
    <button class="btn" id="next" type="button" disabled>Continua</button>
  </section>

  <!-- Passi 2 e 3: PIN -->
  <section id="s-pin" class="hidden">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="pad" id="pad"></div>
    <button class="back" id="back" type="button">‹ Indietro</button>
  </section>

  <p class="demo hidden" id="demo">Modalità prova: dispenser non raggiunto, nulla viene salvato.</p>
</main>

<script>
const PIN_LENGTH = 4;
const $ = id => document.getElementById(id);
let step = 1, name = "", pin1 = "", pin = "", demo = false, busy = false;

const TEXT = {
  1: ["Benvenuto", "Come ti chiami?"],
  2: ["Scegli un PIN", "4 cifre, facili da ricordare ma non ovvie."],
  3: ["Ripeti il PIN", "Inseriscilo ancora una volta per conferma."]
};

function show(n){
  step = n;
  $("title").textContent = TEXT[n][0];
  $("sub").textContent = TEXT[n][1];
  document.querySelectorAll("#steps i").forEach((el, i) => el.classList.toggle("on", i < n));
  $("s-name").classList.toggle("hidden", n !== 1);
  $("s-pin").classList.toggle("hidden", n === 1);
  pin = ""; drawDots(); setMsg("");
  if(n === 1) $("name").focus();
}

async function checkStatus(){
  try{
    const r = await fetch("/api/profile", {signal: AbortSignal.timeout(3000)});
    if(r.ok){ location.replace("index.html"); return; } // già registrato
    if(r.status !== 404) throw new Error(r.status);
  }catch(e){
    demo = true; $("demo").classList.remove("hidden");
  }
}

$("name").addEventListener("input", e => { $("next").disabled = e.target.value.trim().length < 2; });
$("name").addEventListener("keydown", e => { if(e.key === "Enter" && !$("next").disabled) $("next").click(); });
$("next").onclick = () => { name = $("name").value.trim(); show(2); };
$("back").onclick = () => show(step - 1);

function drawDots(){
  $("dots").innerHTML = Array.from({length:PIN_LENGTH}, (_, i) =>
    '<span class="dot'+(i < pin.length ? " on" : "")+'"></span>').join("");
}
function setMsg(t, err){ const m = $("msg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); }

function buildPad(){
  ["1","2","3","4","5","6","7","8","9","","0","del"].forEach(k => {
    if(k === ""){ $("pad").appendChild(document.createElement("span")); return; }
    const b = document.createElement("button");
    b.type = "button"; b.className = "key" + (k === "del" ? " ghost" : "");
    b.textContent = k === "del" ? "Cancella" : k;
    b.setAttribute("aria-label", k === "del" ? "Cancella ultima cifra" : "Cifra " + k);
    b.onclick = () => press(k);
    $("pad").appendChild(b);
  });
}

function press(k){
  if(busy || step === 1) return;
  if(k === "del"){ pin = pin.slice(0, -1); setMsg(""); }
  else if(pin.length < PIN_LENGTH){ pin += k; }
  drawDots();
  if(pin.length === PIN_LENGTH) onPinComplete();
}

function onPinComplete(){
  if(step === 2){
    if(/^(\d)\1{3}$/.test(pin) || pin === "1234" || pin === "4321"){
      setMsg("PIN troppo facile da indovinare. Scegline un altro.", true); return reset();
    }
    pin1 = pin; busy = true;
    setTimeout(() => { busy = false; show(3); }, 250);
  }else{
    if(pin !== pin1){ setMsg("I due PIN non coincidono. Riprova.", true); return reset(); }
    submit();
  }
}

function reset(){
  const d = $("dots"); d.classList.add("shake"); busy = true;
  setTimeout(() => { d.classList.remove("shake"); pin = ""; drawDots(); busy = false; }, 400);
}

async function submit(){
  busy = true; setMsg("Creo il tuo profilo…");
  try{
    let token = "demo-token";
    if(!demo){
      const r = await fetch("/api/register", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name, pin})
      });
      if(r.status === 409){ location.replace("index.html"); return; }
      if(!r.ok) throw new Error(r.status);
      token = (await r.json()).token;
    }
    try{ sessionStorage.setItem("token", token); }catch(e){}
    setMsg("Fatto! Benvenuto, " + name + ".");
    // TODO: sostituire con la dashboard reale (poi: aggiunta prime medicine)
    setTimeout(() => { location.href = "dashboard.html"; }, 800);
  }catch(e){
    setMsg("Il dispenser non risponde. Controlla il Wi‑Fi.", true);
    busy = false; pin = ""; drawDots();
  }
}

document.addEventListener("keydown", e => {
  if(step === 1) return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key === "Backspace") press("del");
});

buildPad();
show(1);
checkStatus();
</script>
</body>
</html>
